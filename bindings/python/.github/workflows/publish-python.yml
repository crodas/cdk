name: "Build and Publish Python Package"

# Sources, including this file, are synced from the cdk monorepo's
# bindings/python directory. Edit them there.

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      cdk_version:
        description: "CDK version to build against (e.g. 0.18.1)"
        required: false
        type: string
      release_tag:
        description: "Tag to create for the GitHub release (e.g. v0.18.1)"
        required: false
        type: string
      publish_target:
        description: "Where to publish the wheels"
        required: false
        default: none
        type: choice
        options:
          - none
          - test-pypi
          - pypi
      prerelease:
        description: "Mark the GitHub release as a pre-release"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [cdk-release]

env:
  CDK_VERSION: ${{ github.event.client_payload.cdk_version || inputs.cdk_version }}
  TAG: ${{ github.event.client_payload.release_tag || inputs.release_tag }}
  PUBLISH_TARGET: ${{ github.event.client_payload.publish_target || inputs.publish_target || 'none' }}
  PRERELEASE: ${{ github.event.client_payload.prerelease || inputs.prerelease || false }}

jobs:
  resolve-version:
    name: "Resolve version"
    runs-on: ubuntu-latest
    outputs:
      pep440_ver: ${{ steps.resolve.outputs.pep440_ver }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      # SemVer tags are not valid PEP 440 versions and a wheel filename must
      # carry a PEP 440 version, so the tag is translated once here.
      - name: Derive versions
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          TAG_IN="${TAG}"
          if [[ -z "${TAG_IN}" ]]; then
            if [[ -z "${CDK_VERSION}" ]]; then
              echo "::error::Provide release_tag or cdk_version"
              exit 1
            fi
            TAG_IN="v${CDK_VERSION}"
          fi

          RELEASE_VER="${TAG_IN#v}"
          CORE="${RELEASE_VER%%-*}"
          SUFFIX=""
          if [[ "${RELEASE_VER}" == *-* ]]; then
            SUFFIX="${RELEASE_VER#*-}"
          fi

          if [[ -z "${SUFFIX}" ]]; then
            PEP440="${CORE}"
          elif [[ "${SUFFIX}" =~ ^nightly[.]([0-9]{8})[.]g([0-9a-f]{7})$ ]]; then
            PEP440="${CORE}.dev${BASH_REMATCH[1]}+g${BASH_REMATCH[2]}"
          elif [[ "${SUFFIX}" =~ ^(alpha|beta|rc)[.]?([0-9]+)$ ]]; then
            case "${BASH_REMATCH[1]}" in
              alpha) MARK="a" ;;
              beta)  MARK="b" ;;
              rc)    MARK="rc" ;;
            esac
            PEP440="${CORE}${MARK}${BASH_REMATCH[2]}"
          else
            echo "::error::Cannot translate ${TAG_IN} into a PEP 440 version"
            exit 1
          fi

          {
            echo "tag=${TAG_IN}"
            echo "pep440_ver=${PEP440}"
          } >> "$GITHUB_OUTPUT"
          echo "Tag: ${TAG_IN}  PEP 440: ${PEP440}"

  build-native:
    name: "Build ${{ matrix.target }}"
    needs: [resolve-version]
    runs-on: ${{ matrix.runner }}
    # Linux builds run inside the manylinux image so the shared object links
    # against glibc 2.28 rather than the runner's much newer glibc.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            container: quay.io/pypa/manylinux_2_28_x86_64
            artifact: libcdk_ffi_python.so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64
            artifact: libcdk_ffi_python.so
          - target: aarch64-apple-darwin
            runner: macos-14
            container: ""
            artifact: libcdk_ffi_python.dylib
          - target: x86_64-apple-darwin
            runner: macos-14
            container: ""
            artifact: libcdk_ffi_python.dylib
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            container: ""
            artifact: cdk_ffi_python.dll

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The manylinux images ship no Rust toolchain and dtolnay/rust-toolchain
      # needs one already present, so bootstrap rustup by hand there.
      - name: Install Rust toolchain (manylinux)
        if: matrix.container != ''
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        if: matrix.container == ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build cdk-ffi-python
        shell: bash
        working-directory: rust
        run: cargo build --release --target ${{ matrix.target }}

      - name: Fix dylib install name
        if: endsWith(matrix.artifact, '.dylib')
        working-directory: rust
        run: |
          install_name_tool -id @rpath/libcdk_ffi.dylib \
            target/${{ matrix.target }}/release/${{ matrix.artifact }}

      - name: Generate Python bindings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        working-directory: rust
        run: |
          mkdir -p ../generated-bindings
          cargo run --release --bin uniffi-bindgen-python -- generate \
            --library "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
            --language python \
            --out-dir ../generated-bindings \
            --no-format

      - name: Upload generated bindings
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: python-bindings-generated
          path: generated-bindings/

      - name: Strip debug symbols
        shell: bash
        working-directory: rust
        run: |
          FILE="target/${{ matrix.target }}/release/${{ matrix.artifact }}"
          case "${{ matrix.target }}" in
            *windows*)  strip --strip-all "$FILE" ;;
            *apple*)    strip -S "$FILE" ;;
            *)          strip --strip-all "$FILE" ;;
          esac

      - name: Prepare artifact
        shell: bash
        run: |
          mkdir -p dist-native
          cp "rust/target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
             "dist-native/${{ matrix.target }}-${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: python-native-${{ matrix.target }}
          path: dist-native/

  package:
    name: "Build wheels"
    needs: [resolve-version, build-native]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install build tooling
        run: |
          set -euo pipefail
          python3 -m venv .build-venv
          .build-venv/bin/pip install --quiet --upgrade pip build "wheel>=0.42"

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts
          pattern: python-native-*
          merge-multiple: true

      - name: Download generated Python bindings
        uses: actions/download-artifact@v8
        with:
          name: python-bindings-generated
          path: ./generated-bindings

      - name: Set package version
        env:
          PEP440_VER: ${{ needs.resolve-version.outputs.pep440_ver }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \"0\\.0\\.0\"$/version = \"${PEP440_VER}\"/" pyproject.toml
          if ! grep -qF "version = \"${PEP440_VER}\"" pyproject.toml; then
            echo "::error::Failed to set the package version in pyproject.toml"
            exit 1
          fi

      # The native library is loaded with ctypes, so a wheel is valid for any
      # CPython 3: build it once per target and retag it py3-none-<platform>.
      - name: Build wheels
        run: |
          set -euo pipefail

          declare -A ARTIFACT_MAP
          ARTIFACT_MAP[x86_64-unknown-linux-gnu]="libcdk_ffi_python.so"
          ARTIFACT_MAP[aarch64-unknown-linux-gnu]="libcdk_ffi_python.so"
          ARTIFACT_MAP[aarch64-apple-darwin]="libcdk_ffi_python.dylib"
          ARTIFACT_MAP[x86_64-apple-darwin]="libcdk_ffi_python.dylib"
          ARTIFACT_MAP[x86_64-pc-windows-msvc]="cdk_ffi_python.dll"

          # uniffi names the loaded library after the cdk-ffi namespace rather
          # than the wrapper crate, so each artifact is renamed on the way in.
          declare -A INSTALLED_MAP
          INSTALLED_MAP[x86_64-unknown-linux-gnu]="libcdk_ffi.so"
          INSTALLED_MAP[aarch64-unknown-linux-gnu]="libcdk_ffi.so"
          INSTALLED_MAP[aarch64-apple-darwin]="libcdk_ffi.dylib"
          INSTALLED_MAP[x86_64-apple-darwin]="libcdk_ffi.dylib"
          INSTALLED_MAP[x86_64-pc-windows-msvc]="cdk_ffi.dll"

          declare -A PLATFORM_MAP
          PLATFORM_MAP[x86_64-unknown-linux-gnu]="manylinux_2_28_x86_64"
          PLATFORM_MAP[aarch64-unknown-linux-gnu]="manylinux_2_28_aarch64"
          PLATFORM_MAP[aarch64-apple-darwin]="macosx_11_0_arm64"
          PLATFORM_MAP[x86_64-apple-darwin]="macosx_10_12_x86_64"
          PLATFORM_MAP[x86_64-pc-windows-msvc]="win_amd64"

          PKG_DIR="src/cdk"
          OUT_DIR="${PWD}/wheelhouse"
          PYBIN="${PWD}/.build-venv/bin/python"
          mkdir -p "${OUT_DIR}"

          for target in "${!PLATFORM_MAP[@]}"; do
            artifact="${ARTIFACT_MAP[$target]}"
            installed="${INSTALLED_MAP[$target]}"
            platform="${PLATFORM_MAP[$target]}"

            echo "::group::Building wheel for ${target} (${platform})"
            rm -rf build dist
            find . -name '*.egg-info' -type d -prune -exec rm -rf {} +
            find "${PKG_DIR}" -type f \
              \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -delete

            cp generated-bindings/cdk_ffi.py "${PKG_DIR}/cdk_ffi.py"
            cp "artifacts/${target}-${artifact}" "${PKG_DIR}/${installed}"

            STAGE=$(mktemp -d)
            "${PYBIN}" -m build --wheel --outdir "${STAGE}"

            "${PYBIN}" -m wheel tags \
              --python-tag py3 \
              --abi-tag none \
              --platform-tag "${platform}" \
              --remove \
              "${STAGE}"/*.whl

            mv "${STAGE}"/*.whl "${OUT_DIR}/"
            rm -rf "${STAGE}"
            echo "::endgroup::"
          done

          echo "Wheels built:"
          ls -1 "${OUT_DIR}"

      - name: Verify wheel contents
        run: |
          set -euo pipefail
          COUNT=$(ls -1 wheelhouse/*.whl | wc -l)
          if [[ "${COUNT}" -ne 5 ]]; then
            echo "::error::Expected 5 wheels, found ${COUNT}"
            exit 1
          fi
          for whl in wheelhouse/*.whl; do
            echo "--- ${whl} ---"
            NAMES=$(python3 -c \
              'import sys, zipfile; print("\n".join(zipfile.ZipFile(sys.argv[1]).namelist()))' \
              "${whl}")
            echo "${NAMES}"

            LIBS=$(grep -cE '^cdk/[^/]+\.(so|dylib|dll)$' <<< "${NAMES}" || true)
            if [[ "${LIBS}" -ne 1 ]]; then
              echo "::error::${whl} contains ${LIBS} native libraries, expected exactly 1"
              exit 1
            fi
            grep -qx 'cdk/__init__.py' <<< "${NAMES}"
            grep -qx 'cdk/cdk_ffi.py' <<< "${NAMES}"
          done

      - name: Generate checksums
        working-directory: wheelhouse
        run: |
          sha256sum *.whl > checksums.sha256
          cat checksums.sha256

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels
          path: wheelhouse/

  publish-pypi:
    name: "Publish to ${{ needs.resolve-version.outputs.tag }} PyPI"
    needs: [resolve-version, package]
    if: ${{ (github.event.client_payload.publish_target || inputs.publish_target) == 'pypi' || (github.event.client_payload.publish_target || inputs.publish_target) == 'test-pypi' }}
    runs-on: ubuntu-latest
    permissions:
      # Required for PyPI trusted publishing.
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: python-wheels
          path: ./wheelhouse

      - name: Drop the checksum file
        run: rm -f wheelhouse/checksums.sha256

      - name: Publish to TestPyPI
        if: ${{ (github.event.client_payload.publish_target || inputs.publish_target) == 'test-pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/
          repository-url: https://test.pypi.org/legacy/

      - name: Publish to PyPI
        if: ${{ (github.event.client_payload.publish_target || inputs.publish_target) == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: wheelhouse/

  publish-release:
    name: "Create GitHub release"
    needs: [resolve-version, package]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download wheels
        uses: actions/download-artifact@v8
        with:
          name: python-wheels
          path: ./wheelhouse

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_OPTIONS=(--generate-notes)
          if [[ "${PRERELEASE}" == "true" ]]; then
            RELEASE_OPTIONS+=(--prerelease)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} exists; uploading assets to it"
            gh release upload "${RELEASE_TAG}" --clobber \
              wheelhouse/*.whl wheelhouse/checksums.sha256
          else
            gh release create "${RELEASE_TAG}" \
              --title "Release ${RELEASE_TAG}" \
              "${RELEASE_OPTIONS[@]}" \
              wheelhouse/*.whl \
              wheelhouse/checksums.sha256
          fi
