# Defaults for consumers that do not set these in their own rootProject.ext.
# android/build.gradle reads them through getExtOrDefault, which falls back to
# `CashuNative_<name>` project properties. Without this file every consumer
# silently inherits whatever their app happens to set.
CashuNative_kotlinVersion=2.2.0
CashuNative_minSdkVersion=24
CashuNative_compileSdkVersion=35
CashuNative_ndkVersion=28.2.13676358

android.useAndroidX=true
