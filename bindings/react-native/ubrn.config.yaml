---
# The Rust lives in this repository, so there is no `repo:`/`branch:` here and
# `ubrn checkout` is never run. Both paths are relative, which is what keeps
# them correct across the several git worktrees this repo is used from.
rust:
  directory: ../..
  manifestPath: crates/cashu-ffi/Cargo.toml

bindings:
  cpp: cpp/generated
  ts: src/generated

# The generated entrypoint and its codegen spec get their own directory, so
# React Native's codegen can scan it without walking node_modules or the
# example app, and so `src/` holds only hand-written code. The entrypoint is
# what installs the Rust crate into Hermes; everything hand-written imports
# through it.
turboModule:
  cpp: cpp
  ts: turbo
  entrypoint: turbo/index.ts

android:
  directory: ./android
  targets:
    - arm64-v8a
    - armeabi-v7a
    - x86_64
    - x86
  apiLevel: 24
  jniLibs: src/main/jniLibs
  packageName: org.cashudevkit.crypto
  # Shared, not static: a static archive is ~48 MB per ABI against ~2 MB for
  # the .so, and cdk-kotlin already ships .so files in jniLibs.
  useSharedLibrary: true

ios:
  directory: ./ios
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios
  frameworkName: CashuFfi
